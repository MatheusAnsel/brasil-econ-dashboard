# Blueprint do Render: API (plano gratuito) que também mantém o ETL em dia.
# O banco fica no Supabase; defina DATABASE_URL no painel (sync: false).
# Sem cron pago: com ETL_AUTO=true a própria API roda o ETL ao subir e a cada hora, se os dados têm mais de 24 horas.
services:
  - type: web
    name: brasil-econ-api
    runtime: node
    buildCommand: npm ci --include=dev
    # As migrações são idempotentes: rodam a cada subida antes de a API abrir a porta.
    startCommand: npm run db:migrate && npm run start -w @econ/api
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL
        value: "true"
      - key: ETL_AUTO
        value: "true"
      - key: ETL_START_DATE
        value: "2005-01-01"
      - key: CORS_ORIGIN
        sync: false
      # Atrás do proxy do Render, o IP real do cliente vem em X-Forwarded-For.
      # Sem isto, o limite de requisições trataria todos os visitantes como um só.
      - key: TRUST_PROXY
        value: "true"
      # Opcional: URL do Redis (ex.: Key Value do Render) para o cache das rotas pesadas.
      # Sem esta variável a API funciona normalmente, só sem cache.
      - key: REDIS_URL
        sync: false
